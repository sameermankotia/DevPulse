# Re-syncs every tracked repository on the hour. Each run is independent, so a
# slow run is skipped rather than overlapped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: devpulse-sync
  namespace: devpulse
spec:
  schedule: '0 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: sync
              image: ghcr.io/sameermankotia/devpulse-api:latest
              command: ['python', '-m', 'app.workers.sync']
              envFrom:
                - configMapRef: { name: devpulse-config }
                - secretRef: { name: devpulse-secrets }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 768Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ['ALL'] }

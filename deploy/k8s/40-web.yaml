apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpulse-web
  namespace: devpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devpulse
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpulse
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/sameermankotia/devpulse-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
          # nginx writes its cache and pid under /var; the rest stays read-only.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devpulse-web
  namespace: devpulse
spec:
  selector:
    app.kubernetes.io/name: devpulse
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
